services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-dev-password}
      POSTGRES_DB: journey
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U app -d journey
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-app-dev-password}@db:5432/journey
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: http://localhost:3000
      EXPERIENCE_START_DATE: ${EXPERIENCE_START_DATE:-2014-01-01}
    volumes:
      - ./content:/content:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      SITE_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - '3000:3000'
volumes:
  pgdata:
